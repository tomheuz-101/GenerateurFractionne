services:
  postgres:
    image: postgres:16-alpine
    container_name: generateur-fractionne-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: generateur_fractionne
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
